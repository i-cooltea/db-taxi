version: '3.8'

services:
  db-taxi:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      # Database configuration
      - DBT_DATABASE_HOST=${DB_HOST:-mysql}
      - DBT_DATABASE_PORT=${DB_PORT:-3306}
      - DBT_DATABASE_USERNAME=${DB_USERNAME:-root}
      - DBT_DATABASE_PASSWORD=${DB_PASSWORD:-rootpassword}
      - DBT_DATABASE_DATABASE=${DB_DATABASE:-myapp}
      - DBT_DATABASE_SSL=${DB_SSL:-false}
      - DBT_DATABASE_MAX_OPEN_CONNS=${DB_MAX_OPEN_CONNS:-25}
      - DBT_DATABASE_MAX_IDLE_CONNS=${DB_MAX_IDLE_CONNS:-5}
      - DBT_DATABASE_CONN_MAX_LIFETIME=${DB_CONN_MAX_LIFETIME:-5m}
      - DBT_DATABASE_QUERY_TIMEOUT=${DB_QUERY_TIMEOUT:-30s}
      
      # Server configuration
      - DBT_SERVER_PORT=8080
      - DBT_SERVER_HOST=0.0.0.0
      - DBT_SERVER_READ_TIMEOUT=${SERVER_READ_TIMEOUT:-30s}
      - DBT_SERVER_WRITE_TIMEOUT=${SERVER_WRITE_TIMEOUT:-30s}
      
      # Logging configuration
      - DBT_LOGGING_LEVEL=${LOG_LEVEL:-info}
      - DBT_LOGGING_FORMAT=${LOG_FORMAT:-json}
      - DBT_LOGGING_OUTPUT=${LOG_OUTPUT:-stdout}
      
      # Security configuration
      - DBT_SECURITY_SESSION_TIMEOUT=${SESSION_TIMEOUT:-30m}
      - DBT_SECURITY_READ_ONLY_MODE=${READ_ONLY_MODE:-false}
      - DBT_SECURITY_ENABLE_AUDIT=${ENABLE_AUDIT:-true}
      
      # Sync system configuration
      - DBT_SYNC_ENABLED=${SYNC_ENABLED:-true}
      - DBT_SYNC_MAX_CONCURRENCY=${SYNC_MAX_CONCURRENCY:-5}
      - DBT_SYNC_BATCH_SIZE=${SYNC_BATCH_SIZE:-1000}
      - DBT_SYNC_RETRY_ATTEMPTS=${SYNC_RETRY_ATTEMPTS:-3}
      - DBT_SYNC_RETRY_DELAY=${SYNC_RETRY_DELAY:-30s}
      - DBT_SYNC_JOB_TIMEOUT=${SYNC_JOB_TIMEOUT:-1h}
      - DBT_SYNC_CLEANUP_AGE=${SYNC_CLEANUP_AGE:-720h}
      
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./configs/docker.yaml:/app/config.yaml:ro
    command: ["./db-taxi", "-config", "/app/config.yaml"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootpassword}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-myapp}
      - MYSQL_USER=${MYSQL_USER:-appuser}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-apppassword}
    ports:
      - "${MYSQL_PORT:-13306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
    driver: local
